/**:
  # Global Parameters
  ros__parameters:
    tf_timeout_threshold: 0.05

/**:
  # Basic Robotics Functions
  # Platform
  platform:
    ros__parameters:
      camera:
        enable: false  # Enable camera

  # State Estimator
  state_estimator:
    ros__parameters:
      # Indoor Motion Capture
      # The mocap_pose plugin was removed; ground_truth now reads mocap directly.
      plugin_name: "ground_truth"
      ground_truth:
        mocap_sub_topic: "/mocap/rigid_bodies"  # Non-empty: subscribe to mocap instead of a pose topic.
        twist_sub_topic: ""  # Empty: differentiate the mocap pose for twist. Required — nothing
                             # publishes ground_truth/twist on a mocap rig, and the pose is only
                             # published together with the twist.
        twist_smooth_filter_cte: 0.1  # (0,1]; 1 = no filter. Applies to the differentiated twist.

      # # Indoor Motion Capture, fused with the IMU (simple_ekf)
      # # Untested on this platform: needs sensor_measurements/imu and covariance tuning.
      # plugin_name: "simple_ekf"
      # simple_ekf:
      #   update_topics: ["mocap"]
      #   mocap:
      #     topic: "/mocap/rigid_bodies"
      #     type: "mocap4r2_msgs/msg/RigidBodies"
      #     rigid_body_name: "1"
      #     set_earth_map: true
      #     use_message_covariance: false  # RigidBodies carries no covariance; use the values below.
      #     position_covariance: [1e-4, 1e-4, 1e-4]     # x, y, z — variance, sigma ~ 1 cm
      #     orientation_covariance: [1e-5, 1e-5, 1e-5]  # roll, pitch, yaw — sigma ~ 0.2 deg

  # Behaviors Motion
  TakeoffBehavior:
    ros__parameters:
      takeoff_plugin_name: "takeoff_plugin_platform"
  LandBehavior:
    ros__parameters:
      land_plugin_name: "land_plugin_platform"
  GoToBehavior:
    ros__parameters:
      go_to_plugin_name: "go_to_plugin_position"
      # go_to_plugin_name: "go_to_plugin_trajectory"
  FollowPathBehavior:
    ros__parameters:
      follow_path_plugin_name: "follow_path_plugin_position"
      # follow_path_plugin_name: "follow_path_plugin_trajectory"

  # Trajectory Generation Behavior
  TrajectoryGeneratorBehavior:
    ros__parameters:
      plugin_name: "dynamic_mav_trajectory_generator"

# Specific Parameters for each drone
drone0:
  # Platform
  platform:
    ros__parameters:
      tello_ip: "192.168.10.1" # IP of platform command
      calibration_file: "config/camera_calibration.yaml"
      camera:
        stream_url: "udp://0.0.0.0:11111" # URL of video stream
  # State Estimator
  state_estimator:
    ros__parameters:
      ground_truth:
        rigid_body_name: "1"


drone1:
  # Platform
  platform:
    ros__parameters:
      tello_ip: "192.168.10.1" # IP of platform command
      calibration_file: "config/camera_calibration.yaml"
      camera:
        stream_url: "udp://0.0.0.0:11111" # URL of video stream
  # State Estimator
  state_estimator:
    ros__parameters:
      ground_truth:
        rigid_body_name: "2"
